# Iceberg tables in the Nessie catalog, the same catalog Spark uses as `nessie`.
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=/warehouse

# Spark writes scheme-less paths (/warehouse/...) into Iceberg metadata. Trino's native
# local file system only accepts local:// and file:// locations, so scheme-less paths go
# through the Hadoop file system, whose default FS is the local disk.
fs.hadoop.enabled=true
