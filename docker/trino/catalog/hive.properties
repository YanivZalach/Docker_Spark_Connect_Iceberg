# Non-Iceberg Hive tables, the same tables Spark sees in `spark_catalog`.
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# Table locations are file:/warehouse/hive/... Without fs.local.enabled there is no native
# factory for the file scheme, so these go through the Hadoop local file system too.
fs.hadoop.enabled=true
